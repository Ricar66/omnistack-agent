name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test sources, generated distribution, and demos
        run: npm run check
      - name: Pack portable installer
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm pack --ignore-scripts
      - name: Save reviewable installer artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: omnistack-agent-installer
          path: omnistack-agent-*.tgz
          if-no-files-found: error
          retention-days: 14
